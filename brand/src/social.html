<!doctype html>
<!-- GitHub social preview and default link card, 1280x640 (render at scale 1). brand/tools/render-html.sh -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reelbird social card</title>
<style>
@font-face { font-family: "Fraunces"; src: url("../../site/src/assets/fonts/fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Instrument Sans"; src: url("../../site/src/assets/fonts/instrument-sans-var.woff2") format("woff2"); font-weight: 400 700; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body { background: #1A1512; position: relative; -webkit-font-smoothing: antialiased; color: #FFF4E8; }
.lift { position: absolute; left: -260px; top: -380px; width: 1100px; height: 900px;
  background: radial-gradient(closest-side, #2A2320, transparent); opacity: .85; }
.copy { position: absolute; left: 88px; top: 92px; width: 520px; }
.logo { height: 46px; display: block; }
h1 { margin-top: 64px; font: 400 62px/1.06 "Fraunces", serif; font-variation-settings: "opsz" 96, "SOFT" 50; letter-spacing: -0.018em; }
p { margin-top: 30px; font: 500 22px/1.4 "Instrument Sans", sans-serif; color: #A69C93; letter-spacing: .005em; }
.shot { position: absolute; left: 636px; top: 118px; width: 1200px; }
.shot img { width: 100%; display: block; }
</style>
</head>
<body>
<div class="lift"></div>
<div class="shot"><img src="../screenshots/editor-dark-window.webp" alt=""></div>
<div class="copy">
  <img class="logo" src="../logo-dark.svg" alt="">
  <h1>Record your screen.<br>Send the link.<br>Polish it later.</h1>
  <p>Free and open source, for macOS</p>
</div>
</body>
</html>
