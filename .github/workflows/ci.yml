name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Apple silicon, macOS 26, Xcode 26 (Swift 6.2 or later, which Package.swift needs).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Build
        run: scripts/build.sh

      - name: Test
        # Runs without Screen Recording, camera or microphone permission; capture tests use
        # synthetic sources. Hosted runners are virtual machines, so hardware encoders may be
        # missing; the encoder falls back to software there.
        run: scripts/test.sh

      - name: Build the app
        run: RB_SIGN_IDENTITY=- scripts/build-app.sh
